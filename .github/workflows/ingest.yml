# Scheduled agenda ingest (agent-scraper-spec §9 P2-D). Calls /api/cron/ingest every 3 hours,
# on top of Vercel's daily cron (vercel.json). Uses the repo secret CRON_SECRET and the repo
# variable APP_URL. Turn it off after the hackathon (Oct 23, 2026): disable the workflow in the
# Actions tab, or delete the schedule block.
name: Ingest agendas

on:
  schedule:
    - cron: '15 */3 * * *' # UTC
  workflow_dispatch:
    inputs:
      source:
        description: One source id from data/sources.yaml (blank runs the full schedule)
        required: false
        default: ''
      mode:
        description: rotation, near_term or results (only with a source)
        required: false
        default: ''

permissions: {}

concurrency:
  group: ingest
  cancel-in-progress: false

# The scheduled run is a matrix of shards (district coverage plan 0.8): each job calls the route for
# one shard, so every call stays under Vercel's 300-second limit as sources grow. Raise SHARDS (and
# the list) together as the registry grows; a manual run with a source ignores the matrix.
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - name: Call the ingest route
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL }}
          SOURCE: ${{ inputs.source }}
          MODE: ${{ inputs.mode }}
          SHARD: ${{ matrix.shard }}
          SHARDS: 6
        run: |
          query="?shard=${SHARD}&shards=${SHARDS}"
          if [ -n "$SOURCE" ]; then
            # One source runs once, from the first matrix job only.
            if [ "$SHARD" != "0" ]; then exit 0; fi
            query="?source=${SOURCE}"
            if [ -n "$MODE" ]; then query="${query}&mode=${MODE}"; fi
          fi
          curl -fsS --max-time 310 -H "Authorization: Bearer ${CRON_SECRET}" "${APP_URL}/api/cron/ingest${query}"
