# HCAD documents source layers, attributes, release cadence and source CRS.
# Loads contain only code-mapped City/School/College boundaries, not parcel or owner data.
- id: hcad-city-school-boundaries
  source_url: https://hcad.org/pdata/pdata-gis-downloads.html
  dictionary_url: https://hcad.org/assets/uploads/pdf/resources/2026/GIS-ReadMeV2-2.pdf
  verified_on: '2026-10-20'
  release_updated: '2026-10-05'
  source_crs: EPSG:2278
  output_crs: EPSG:4326
  layers:
    - name: City
      allowed_body_types: [city_council]
      source_code_field: Code
    - name: School
      allowed_body_types: [school_board]
      source_code_field: Code
    - name: College
      allowed_body_types: [college_board]
      source_code_field: Code
# District coverage plan 0.4: the county's water-district polygons, keyed by HCAD code (field `code`).
# The service shows no edit date, so release_updated is the day it was fetched and checked.
# Fetch each layer already reprojected (layer 0 = HCAD_MUD, 1 = HCAD_Water_Districts):
#   curl -o tmp/scratch/hcad/HCAD_MUD.geojson "<source_url>/0/query?where=1%3D1&outFields=code,name&outSR=4326&f=geojson"
- id: hc-water-districts
  source_url: https://www.gis.hctx.net/arcgishcpid/rest/services/Permits/MUDandWaterDistricts_HCAD/MapServer
  dictionary_url: https://www.gis.hctx.net/arcgishcpid/rest/services/Permits/MUDandWaterDistricts_HCAD/MapServer
  verified_on: '2026-10-28'
  release_updated: '2026-10-28'
  source_crs: EPSG:2278
  output_crs: EPSG:4326
  layers:
    - name: HCAD_MUD
      allowed_body_types: [mud]
      source_code_field: code
    - name: HCAD_Water_Districts
      allowed_body_types: [mud]
      source_code_field: code
