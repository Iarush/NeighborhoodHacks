- id: spring_isd_board
  body_id: spring_isd_board
  adapter: llm_extract
  config:
    # Apptegy: the document list is JSON inside the page; PDFs are on Thrillshare's asset host.
    index_url: https://www.springisd.org/documents/our-district/board-of-trustees/board-meetings/2026/meeting-notices%2C-agendas/864365
    link_pattern: "(?i)thrillshare\\.com/.+agenda[^/]*\\.pdf"   # "Signed-Agenda-Notice---October-13-2026---Regular-Meeting.pdf"
    embedded_links: true
    date_from: filename
    meeting_type_from_text: { special: "(?i)special" }
    expected_max_gap_days: 45
- id: aldine_isd_board
  body_id: aldine_isd_board
  adapter: llm_extract
  config:
    # aldineisd.org "Board Material" is a Google Drive folder (Use-your-Drive plugin). This is its public
    # "Agenda and Meeting Notice/2026" subfolder. A new year means a new folder ID; the gap check will flag it.
    index_url: https://drive.google.com/embeddedfolderview?id=1F9L5Tc3g6LCH6lDBPryNpozDnyhI-Vrz
    # Regular and special meetings only. The folder also holds grievance-hearing notices whose
    # file names carry private people's names; this pattern must keep excluding them.
    link_pattern: "(?i)^posting of (regular|special called) meeting"
    match_link_text: true
    date_from: link_text                          # "Posting of Regular Meeting_10.19-20.26.pdf"
    date_range: last                              # Monday study session + Tuesday vote; the vote day
    meeting_type_from_text: { special: "(?i)special" }
    expected_max_gap_days: 45
- id: channelview_isd_board
  body_id: channelview_isd_board
  adapter: boardbook
  config: { org_id: 791, expected_max_gap_days: 45 }   # linked from cvisd.org/page/school-board
- id: dayton_isd_board
  body_id: dayton_isd_board
  adapter: llm_extract
  config:
    # ParentSquare Smart Sites. One page per year ("2026 Agendas"); a new year means a new page ID.
    index_url: https://www.daytonisd.net/194288_3
    link_pattern: "(?i)parentsquare\\.com/.+agenda[^/]*\\.pdf$"   # "20260818_agenda-3.pdf"
    date_from: link_text                          # "August 18, 2026 Agenda"
    meeting_type_from_text: { special: "(?i)special|called" }
    expected_max_gap_days: 45
- id: deer_park_isd_board
  body_id: deer_park_isd_board
  adapter: llm_extract
  config:
    index_url: https://www.dpisd.org/apps/pages/index.jsp?uREC_ID=1563698&type=d&pREC_ID=1691104   # Edlio "Board of Trustees Agendas"
    # Matched on the link text: the page also lists hearings and grievance notices whose titles
    # carry private people's names, and they share dates with the agenda. Keep excluding them.
    link_pattern: "(?i)agenda summary|workshop"
    match_link_text: true
    date_from: link_text                          # "October 19, 2026 - Agenda Summary"
    meeting_type_from_text: { special: "(?i)special|called" }
    expected_max_gap_days: 45
- id: humble_isd_board
  body_id: humble_isd_board
  adapter: diligent
  config: { portal: humbleisd, expected_max_gap_days: 45 }
